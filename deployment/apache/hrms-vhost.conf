<VirtualHost *:80>
    ServerName hrms.example.com
    RewriteEngine On
    RewriteRule ^/(.*)$ https://hrms.example.com/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hrms.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hrms.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hrms.example.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(self), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    RedirectMatch 403 ^/(src|server|client|node_modules)(/|$)
    RedirectMatch 403 (?i)\.(map|tsx|ts|jsx|js\.map|css\.map|md|bak|env|log)$

    ProxyPass /socket.io/ ws://127.0.0.1:5000/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:5000/socket.io/

    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    <Location /assets/>
        Header set Cache-Control "public, immutable"
    </Location>

    <Location /uploads/>
        Header set Cache-Control "private, no-store"
    </Location>
</VirtualHost>
</IfModule>
