<svg width="760" height="180" viewBox="0 0 760 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gitakshmi HR logo</title>
  <desc id="desc">Minimal SaaS logo with gradient abstract triangle icon and Gitakshmi HR wordmark.</desc>

  <defs>
    <linearGradient id="iconGradientA" x1="18" y1="18" x2="138" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="iconGradientB" x1="42" y1="34" x2="126" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="58" y1="64" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="softShadow" x="0" y="0" width="760" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="752" height="172" rx="24" fill="#FAFBFF" filter="url(#softShadow)"/>

  <g transform="translate(26,26)">
    <path d="M58 10C61.1 4.6 68.9 4.6 72 10L132.8 115.3C136 120.8 132.1 127.8 125.8 127.8H4.2C-2.1 127.8-6 120.8-2.8 115.3L58 10Z" fill="url(#iconGradientA)"/>
    <path d="M67.2 32.5C69 29.3 73.6 29.3 75.4 32.5L116.6 103.8C118.5 107 116.2 111 112.6 111H30C26.4 111 24.1 107 26 103.8L67.2 32.5Z" fill="url(#iconGradientB)"/>
    <path d="M50.8 86.4L72.4 63.5L92.7 83.6L72.9 103.8L50.8 86.4Z" fill="url(#accentGradient)"/>
  </g>

  <g transform="translate(190,57)">
